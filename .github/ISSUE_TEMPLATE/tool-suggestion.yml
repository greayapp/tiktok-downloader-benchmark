name: Suggest a tool
description: Suggest a TikTok downloader website for a future edition.
title: "[Tool] <domain>"
labels: ["tool-suggestion"]
body:
  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: example.com
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why should it be included?
      description: For example how widely it is used. Inclusion follows SPEC.md §3.
  - type: dropdown
    id: affiliation
    attributes:
      label: Your relationship to the tool
      options:
        - No affiliation
        - I run or work for this tool
    validations:
      required: true
